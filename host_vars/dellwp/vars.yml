---
# host_vars/dellwp/vars.yml: values of the WordPress VM that more than one play needs (the secrets are in vault_wp.yml).
# The loopback port the catch-all and every site's vhost listen on. terraform/cloudflare/main.tf (wp_origin) must match it: Terraform cannot read this file.
wp_nginx_listen_port: 8080
# A host name only a local curl can send (Cloudflare forwards only names under the domain). The health vhost of tasks/wp_nginx_base_common.yml answers it and the
# tunnel check (dellwp/cloudflared_check_dellwp.yml) asks for it, so the check can tell "nginx is up" from the catch-all's closed connection.
wp_health_host: wp-healthz.internal
# The data disk (declared as data_disk in host_vars/delloptiplex3040/vars.yml, formatted and mounted by tasks/wp_data_disk_common.yml). The device path is the one the
# hypervisor gives scsi1 (stable across reboots, unlike /dev/sdb); the label names the filesystem; the mount point holds everything the sites own.
wp_data_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
wp_data_label: wpdata
wp_data_mount: /srv/wp

# The sites (tasks/wp_sites_common.yml, dellwp/wp_sites_dellwp.yml). The domain is the shop's zone; a site's host name is always <name>.<wp_domain> (no friend domains).
wp_domain: example.com
# Names no site may take: the shop, the lab and the tunnel names, plus the health vhost's label.
wp_reserved_names: [bloomy, bloomy-staging, ntfy, ntfy-acer, hub, wg, lab, wp-healthz, www, mail]
# What the sites may not spend: RAM for the OS, nginx, cloudflared, Alloy, node_exporter and the page cache; disk for backups, intake and scratch. The play refuses a
# list whose limits do not fit.
wp_vm_ram_reserve_mb: 1536
wp_data_reserve_mb: 12288
# Functions php-fpm may not call (a site can list exceptions in php_allow_functions). The WP-CLI one-shot containers do not load this file.
wp_php_disable_functions: [exec, passthru, shell_exec, system, proc_open, popen, pcntl_exec, pcntl_fork, pcntl_signal, pcntl_alarm, posix_kill, posix_setuid, posix_setgid, dl, symlink, link, show_source]
# Every field a site may omit; wp_sites entries override these. name, port and quota_id are required. state: hold = nginx answers only a local curl and the
# timers skip; live = public. secret_rev: bump it to rotate that site's database password and salts (they derive from dellwp_wp_master_secret).
wp_site_defaults:
  state: hold
  secret_rev: 1
  php_mem_mb: 512
  db_mem_mb: 256
  cpus: 1.0
  pids_limit: 200
  php_memory_limit: 256M
  fpm_max_children: 4
  opcache_mb: 128
  db_buffer_pool_mb: 64
  quota_mb: 3072
  upload_mb: 64
  allow_xmlrpc: false
  php_allow_functions: []
# port = the loopback port of the site's php-fpm container (unique per site); quota_id = its ext4 project id (unique, never reused for another site).
wp_sites:
  - name: wptest
    port: 9101
    quota_id: 1001
    state: hold

# The operator's tools on the VM (tasks/wp_tools_common.yml, templates/wp/): wp-site-cli, wp-site-install, wp-site-login-check and their shared library. The WP-CLI one-shot
# containers get these limits (memory equals swap); the pin is in vars/wp.yml.
wp_tools_bin: /usr/local/sbin
wp_tools_lib: /usr/local/lib/wp-tools
wp_cli_mem_mb: 384
wp_cli_cpus: 1.0
wp_cli_pids: 128
