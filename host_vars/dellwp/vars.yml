---
# host_vars/dellwp/vars.yml: values of the WordPress VM that more than one play needs (the secrets are in vault_wp.yml).
# The control app's VM may open ssh here, and only that (the key it logs in with is forced to the wp-ctl dispatcher: tasks/wp_ctl_common.yml). The hub, the AOpen, the Dell and this VM name it:
# four layers that must agree (templates/nftables/_vm_input.j2).
vm_nft_extra_tcp:
  - { src: "{{ hostvars['aopenpanel']['overlay_ip'] }}", ports: [22], comment: "ssh: the control app on aopenpanel (wp-ctl, forced command)" }
# The loopback port the catch-all and every site's vhost listen on. terraform/cloudflare/main.tf (wp_origin) must match it: Terraform cannot read this file.
wp_nginx_listen_port: 8080
# A second loopback port on every vhost, for the update job's health probe: the same server block, so the probe exercises the same rules a visitor meets, but the maintenance flag
# does not turn it into a 503 (the job probes the site BEFORE it reopens it). Nothing dials it from outside: cloudflared is pointed at wp_nginx_listen_port only.
wp_nginx_probe_port: 8081
# The page cache for anonymous visitors (the zone, its path and the bypass maps are in tasks/wp_nginx_base_common.yml, the per-site rules in templates/wp/site_nginx.conf.j2). A page is kept this
# many seconds; 0 turns the cache off in every vhost. There is no purge: an edit shows within this time, and `find <wp_page_cache_path> -type f -delete` empties it at once. Logged-in users, carts,
# the REST API, search, previews and anything with an Authorization header never touch it. The zone's name carries its size because nginx refuses a reload that redefines a zone with another
# size (tasks/wp_nginx_base_common.yml, 2026-10-24): change wp_page_cache_keys_mb and the name changes with it.
wp_page_cache_s: 300
wp_page_cache_keys_mb: 10
wp_page_cache_zone: "wp_pages_{{ wp_page_cache_keys_mb }}m"
wp_page_cache_path: /var/cache/nginx/wp_pages
wp_page_cache_max_mb: 256
# A host name only a local curl can send (Cloudflare forwards only names under the domain). The health vhost of tasks/wp_nginx_base_common.yml answers it and the
# tunnel check (dellwp/cloudflared_check_dellwp.yml) asks for it, so the check can tell "nginx is up" from the catch-all's closed connection.
wp_health_host: wp-healthz.internal
# The data disk (declared as data_disk in host_vars/delloptiplex3040/vars.yml, formatted and mounted by tasks/wp_data_disk_common.yml). The device path is the one the
# hypervisor gives scsi1 (stable across reboots, unlike /dev/sdb); the label names the filesystem; the mount point holds everything the sites own.
wp_data_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
wp_data_label: wpdata
wp_data_mount: /srv/wp

# The sites (tasks/wp_sites_common.yml, dellwp/wp_sites_dellwp.yml). The domain is the shop's zone; a site's host name is always <name>.<wp_domain> (no friend domains).
wp_domain: example.com
# Names no site may take: the shop, the lab and the tunnel names, plus the health vhost's label.
wp_reserved_names: [bloomy, bloomy-staging, ntfy, ntfy-acer, hub, vps-hub, wg, lab, wp-healthz, www, mail]
# What the sites may not spend: RAM for the OS, nginx, cloudflared, Alloy, node_exporter and the page cache; disk for intake and scratch (the backups have quotas of their own). The play refuses a
# list whose limits do not fit.
wp_vm_ram_reserve_mb: 1536
wp_data_reserve_mb: 9216
# Where the play puts a site's stack unit and its nginx vhost: the play, the tombstone tasks, the status tool, the verifier and wp-site-delete all use these two, so the tool removes
# exactly what the play wrote.
wp_unit_dir: /etc/systemd/system
wp_vhost_dir: /etc/nginx/conf.d
# Functions php-fpm may not call (a site can list exceptions in php_allow_functions). The WP-CLI one-shot containers do not load this file.
wp_php_disable_functions: [exec, passthru, shell_exec, system, proc_open, popen, pcntl_exec, pcntl_fork, pcntl_signal, pcntl_alarm, posix_kill, posix_setuid, posix_setgid, dl, symlink, link, show_source]
# Every field a site's record may omit; the record overrides these. name, port and quota_id are always in a record. state: hold = nginx answers only a local curl and the
# timers skip; live = public. secret_rev: bump it to rotate that site's database password and salts (they derive from dellwp_wp_master_secret).
wp_site_defaults:
  state: hold
  update_policy: notify
  secret_rev: 1
  php_mem_mb: 512
  db_mem_mb: 256
  cpus: 1.0
  pids_limit: 200
  php_memory_limit: 256M
  fpm_max_children: 4
  opcache_mb: 128
  db_buffer_pool_mb: 64
  quota_mb: 3072
  upload_mb: 64
  backup_quota_mb: 3072
  allow_xmlrpc: false
  allow_app_passwords: false
  allow_user_enum: false
  mail_mode: log
  php_allow_functions: []
# The sites are not listed here: a site is a record in the registry on dellwp (/srv/wp/sites/<name>/site.json), made by wp-ctl create. What stays here is the FLOOR of numbers: the ports and
# quota project ids of the sites of the old engine, which are all closed and gone. wp-site-provision never gives a new site a number at or below these (it takes the next one above everything ever
# recorded, tombstones and this floor included), so no new site can inherit a trace of an old one in the quota tables or the backups. Their NAMES are free to use again; only the numbers are held.
# port = the loopback port of the site's php-fpm container; quota_id = its ext4 project id. Nothing here is ever removed or changed.
wp_closed_floor:
  - {name: wptest, port: 9101, quota_id: 1001}
  - {name: helloworld, port: 9102, quota_id: 1002}
  - {name: rehearsal, port: 9103, quota_id: 1003}
  - {name: rehearsal2, port: 9104, quota_id: 1004}
  - {name: rehearsal3, port: 9105, quota_id: 1005}
  - {name: rehearsal4, port: 9106, quota_id: 1006}
  - {name: rehearsal5, port: 9107, quota_id: 1007}
  - {name: rehearsal6, port: 9108, quota_id: 1008}
  - {name: rehearsal7, port: 9109, quota_id: 1009}
  - {name: parity1, port: 9110, quota_id: 1010}

# The operator's tools on the VM (tasks/wp_tools_common.yml, templates/wp/): wp-site-cli, wp-site-install, wp-site-login-check and their shared library. The WP-CLI one-shot
# containers get these limits (memory equals swap); the pin is in vars/wp.yml.
wp_tools_bin: /usr/local/sbin
wp_tools_lib: /usr/local/lib/wp-tools
# wp-site-provision (templates/wp/wp_site_provision.py.j2, scripts/wp_site_provision.py): makes a site and keeps it matching its record under wp_data_mount/sites/<name>/site.json. It renders the
# site templates itself, from copies in wp_tools_lib/templates, so it needs the master secret on the VM: root-only files in wp_provision_secret_dir, written by tasks/wp_tools_common.yml from the vault
# (the Resend key only while the vault has one). wp_provision_platform_vars names the values the templates and the tool read; tests/test_wp_site_provision_wrapper.py fails when the list and the code
# disagree, and a name is listed rather than found because the play also holds the master secret in a variable that starts with wp_.
wp_provision_secret_dir: /etc/wp-tools
wp_provision_lock_dir: /run/wp-site-provision
wp_provision_command_timeout_s: 120
wp_provision_probe_tries: 6
wp_provision_probe_delay_s: 5
wp_provision_platform_vars:
  - wp_2fa_roles
  - wp_backup_dir
  - wp_backup_quota_offset
  - wp_data_mount
  - wp_db_stop_grace_s
  - wp_db_uid
  - wp_domain
  - wp_image_db
  - wp_image_php
  - wp_login_limit_ip
  - wp_login_limit_user
  - wp_login_window_s
  - wp_mail_per_day
  - wp_mail_per_hour
  - wp_mail_sender_domain
  - wp_mu_dir
  - wp_mu_mount
  - wp_nginx_listen_port
  - wp_nginx_probe_port
  - wp_page_cache_s
  - wp_page_cache_zone
  - wp_php_disable_functions
  - wp_php_uid
  - wp_stack_start_timeout_s
  - wp_stack_stop_timeout_s
  - wp_unit_dir
  - wp_vhost_dir
# WP-CLI unpacks a core download into /tmp: with 128 MB it unpacked 1347 of 3341 files, truncated others and still said "Success" (A/B on dellwp, 2026-10-24); 256 MB unpacked all
# and verified. tmpfs pages count against the container's memory, and 256 MB of /tmp was proven together with 768 MB of memory, so these two move together.
wp_cli_mem_mb: 768
wp_cli_tmp_mb: 256
wp_cli_cpus: 1.0
wp_cli_pids: 128

# Timers (tasks/wp_tools_common.yml, templates/wp/wp_cron*.j2). A site's cron runs every five minutes while it is live. While wp_freeze_file exists, or a site's own
# <site dir>/freeze, every WordPress timer skips its run (and counts it as a success). A failed job tells this ntfy topic through ntfy-notify.
wp_freeze_file: /srv/wp/freeze
wp_ntfy_topic: homeserver
wp_cron_calendar: "*:0/5"
wp_cron_jitter_s: 20
wp_cron_timeout_s: 300

# The site stacks' systemd units (templates/compose_stack.service.j2): how long `systemctl start/restart` may take to get every service healthy, and `stop` to take it down.
# The stop timeout must exceed the database's stop grace period (compose sends SIGTERM and waits that long before SIGKILL; a killed InnoDB recovers at the next start).
wp_stack_start_timeout_s: 240
wp_stack_stop_timeout_s: 120
wp_db_stop_grace_s: 60

# Disk alerts (tasks/wp_disk_check_common.yml, templates/wp/wp_disk_check.sh.j2): a site's project quota warns at 80% and is critical at 95%, the data disk warns at 75% and
# is critical at 90%. The check runs every ten minutes; state (the last level told) is kept in wp_disk_state_dir.
wp_disk_warn_pct: 80
wp_disk_crit_pct: 95
wp_data_warn_pct: 75
wp_data_crit_pct: 90
wp_disk_state_dir: /var/lib/wp-disk-check
wp_disk_calendar: "*:0/10"

# Backups (tasks/wp_project_quota_common.yml, templates/wp/wp_site_backup.sh.j2). A site's backups live in wp_backup_dir/<site>, in their own quota project: its id is the site's
# quota_id plus wp_backup_quota_offset (the play refuses an offset that could collide with another site's id, or reach wp_scratch_quota_id). One job per site per night, hold or live;
# the newest wp_backup_keep_daily snapshots are kept, plus the newest of each of the wp_backup_keep_weekly weeks before them. Under a freeze backups still run but nothing is pruned.
wp_backup_dir: "{{ wp_data_mount }}/backups"
wp_backup_calendar: "*-*-* 03:15:00"
wp_backup_jitter_s: 300
wp_backup_timeout_s: 3600
wp_backup_keep_daily: 7
wp_backup_keep_weekly: 3
# The snapshot the update job takes before it changes anything is tagged (tag=pre-update in its MANIFEST) and pruned on its own: the newest wp_backup_keep_preupdate are kept, and they
# do not count towards the daily and weekly ones, so a night with an update does not push a nightly snapshot out.
wp_backup_keep_preupdate: 2
# The last backup of a site that is about to stop (wp-site-backup --tag=final, taken by wp-ctl ensure-state state=stopped) is tagged too and kept on its own: the newest wp_backup_keep_final. It is what a
# delete archives, so it must outlive the nightly pruning; and it does not count towards the daily and weekly ones either.
wp_backup_keep_final: 1
wp_backup_quota_offset: 1000
wp_backup_stale_hours: 30
wp_backup_check_calendar: hourly
# The restore drill (templates/wp/wp_site_restore.sh.j2) restores into a scratch copy under wp_data_mount/scratch in this project, one at a time, with a throwaway database.
wp_scratch_quota_id: 3000001
wp_scratch_quota_mb: 3072
# The archive of deleted sites (templates/wp/wp_site_delete.sh.j2): wp-site-delete keeps the last backup of a site it removes for wp_archive_keep_days days, in this directory, in a quota
# project of its own; wp-archive-purge (daily) removes archives whose time is up. Its quota counts in wp_data_reserve_mb together with scratch (3072 + 3072 + 3072 of intake). A site is
# never archived if the archive would not fit: the tool stops before it removes anything.
wp_archive_dir: "{{ wp_data_mount }}/archive"
wp_archive_quota_id: 3000002
wp_archive_quota_mb: 3072
wp_archive_keep_days: 14
wp_archive_purge_calendar: "*-*-* 05:15:00"
# The intake directory (made by the data disk play, mode 0700): where a friend's .wpress is copied before wp-site-import reads it. Its work-<site> directory (the unpacked copy waiting for the
# operator's approval) and ledger.log live here too, in this project, because /srv/wp/scratch is shared with the restore drill, which sets and then removes its project limit around its own run.
# The archive file itself counts against the quota, so it holds the file plus what is unpacked from it (a plan that does not fit is refused before anything is written).
wp_intake_dir: "{{ wp_data_mount }}/intake"
wp_intake_quota_id: 3000003
wp_intake_quota_mb: 3072
# The longest any one command of wp-site-import (a docker exec, a WP-CLI call, wp-site-ext, the SQL load) may run before the tool stops it: a hung container must not hold the import lock for ever.
wp_import_step_timeout_s: 3600
# Approvals by phone (scripts/wp_approvals.py, scripts/wp_approval_listener.py): a finished import sends a notification with Approve and Deny buttons to the independent ntfy, the one the alert
# fallback already uses; its address and topic are read from wp_ntfy_conf at run time, so the address is written once (tasks/ntfy_notify_common.yml). The files in wp_approvals_dir are root-only and
# rendered by the play from the vault: key (signs the tokens), approver (login:password of the user that can only post to the reply topic; it is inside the buttons) and listener (login:password of the
# user that can only read it). wp_ntfy_netrc is the file ntfy-notify's fallback already reads. A token is good for wp_approvals_ttl_s seconds and for one use.
wp_approvals_dir: /etc/wp-approvals
wp_approvals_reply_topic: wp-approvals
wp_approvals_ttl_s: 86400
wp_ntfy_conf: /etc/ntfy-notify.conf
wp_ntfy_netrc: /etc/ntfy-notify.netrc
# The listener (scripts/wp_approval_listener.py, dellwp/wp_approvals_dellwp.yml) follows the reply topic as the read-only user and hands each token to wp-site-import resolve. It remembers the last
# message it handled in wp_approvals_state_dir, handles at most wp_approvals_max_per_minute tokens a minute, and gives the tool wp_approvals_resolve_timeout_s to finish (an approve copies code in and
# takes a backup). wp_ntfy_notify_cmd is the command tasks/ntfy_notify_common.yml installs; the result of a decision goes to wp_ntfy_topic.
wp_approvals_state_dir: /var/lib/wp-approvals
wp_approvals_max_per_minute: 20
wp_approvals_read_timeout_s: 120
wp_approvals_resolve_timeout_s: 7200
wp_ntfy_notify_cmd: /usr/local/bin/ntfy-notify
# The control dispatcher (scripts/wp_ctl.py, templates/wp/wp_ctl.py.j2, tasks/wp_ctl_common.yml; design in docs/wordpress_hosting_explained.md section 11): the one program the control app's ssh key may run, and the
# operator's own `sudo wp-ctl`. wp_ctl_user is the account that key logs in as (its only sudoers entry is wp-ctl). wp_ctl_panel_keys are the public keys allowed to log in as it, each forced to wp-ctl;
# the list is empty until the control app's key exists, and an empty list means nobody can log in as that account. wp_ctl_panel_from is the one address those keys may log in from: the control app's VM. wp_ctl_state_dir holds the jobs (one directory each: its request, its log, its exit code) and
# the per-site locks, and a job directory is removed after wp_ctl_job_keep_days days. wp_ctl_run_dir (a tmpfs) holds the files a tool reads its typed answers from, so a password is never written to
# the disk. wp_ctl_audit_file is append-only (chattr +a, if the filesystem takes it) and every line is also sent to the journal, which Alloy ships to Loki. A request line may be wp_ctl_max_request_bytes long.
wp_ctl_user: wpctl
wp_ctl_panel_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG0YR9jcuMtF2TtE8KuGFtn0s1MmfnNOl9wx6ToavxK9 wp-panel@aopenpanel
wp_ctl_panel_from: "{{ hostvars['aopenpanel']['overlay_ip'] }}"
wp_ctl_state_dir: /var/lib/wp-ctl
wp_ctl_run_dir: /run/wp-ctl
wp_ctl_audit_file: /var/log/wp-ctl/audit.jsonl
wp_ctl_job_keep_days: 14
wp_ctl_max_request_bytes: 65536
# What each verb may use, like a function's timeout and memory. timeout_s: how long its tool may run before it is stopped (every job and the upload must name their own). memory_mb and tasks: the cap of a
# JOB's systemd unit (MemoryMax, TasksMax) on the tool's own processes (bash, gzip, tar, the Python importer); the containers a tool starts keep the limits of their compose files (wp_cli_mem_mb and so on)
# and are not counted here. `default` gives all three; a verb overrides what it names; a verb that does not exist, or a key that is not one of the three, stops wp-ctl at its next start. The numbers are
# `[proposed]`, not measured: the approval timeout is the listener's (wp_approvals_resolve_timeout_s), the import's step limit is wp_import_step_timeout_s. A job that dies with status 137, or whose log
# says "Killed", ran out of memory_mb: raise it for that verb.
wp_ctl_limits:
  default: { timeout_s: 120, memory_mb: 512, tasks: 256 }
  password: { timeout_s: 300 }
  backup: { timeout_s: 3600 }
  delete: { timeout_s: 3600 }
  create: { timeout_s: 1800 }
  apply: { timeout_s: 1800 }
  set: { timeout_s: 1800 }
  ensure-state: { timeout_s: 5400 }
  install: { timeout_s: 600 }
  import-receive: { timeout_s: 14400 }
  import-run: { timeout_s: 14400, memory_mb: 1024 }
  import-approve: { timeout_s: 7200, memory_mb: 1024 }
  import-reset: { timeout_s: 7200, memory_mb: 1024 }
  import-rescan: { timeout_s: 3600, memory_mb: 1024 }
  import-new: { timeout_s: 21600, memory_mb: 1024 }
  update-check: { timeout_s: 1800 }
  update-apply: { timeout_s: 5400, memory_mb: 1024 }
  vuln-check: { timeout_s: 300 }
  users: { timeout_s: 60 }
  import-list: { timeout_s: 60 }
wp_restore_db_mem_mb: 384
wp_restore_db_buffer_pool_mb: 64
# The monthly restore drill (templates/wp/wp_restore_drill.sh.j2): the 1st of the month at 05:30 local, after the Proxmox job at 04:00 has finished. One random site that has a good backup.
wp_drill_calendar: "*-*-01 05:30:00"
wp_drill_timeout_s: 1800

# The update job (templates/wp/wp_site_update.sh.j2, run by wp-update@<site>.timer). A site's `update_policy:` is auto (the job applies what is available), notify (it tells ntfy what is
# available, once per set, and changes nothing; `wp-site-update <site> --apply` does it by hand) or freeze (it does nothing). The default is notify. It runs once a night before the
# backup (03:15) and has a hard time limit of 50 minutes, so it can never run into it. Persistent=false: a night missed because the VM was off is skipped, not run at a random hour.
# The probe asks the site's probe port (wp_nginx_probe_port) for the home page and the login form, tries wp_update_probe_tries times, wp_update_probe_wait_s apart.
wp_update_calendar: "*-*-* 02:00:00"
wp_update_jitter_s: 300
wp_update_timeout_s: 3000
wp_update_probe_tries: 3
wp_update_probe_wait_s: 10

# Scans (dellwp/wp_scans_dellwp.yml, tasks/wp_scans_common.yml; the tools are installed by dellwp/wp_sites_dellwp.yml): ClamAV in a one-shot container with its signatures in wp_clamav_dir, refreshed daily;
# and the Wordfence Intelligence vulnerability feed (templates/wp/wp_vulnfeed.py.j2, scripts/wp_vulnfeed.py): downloaded daily with a free API key (host_vars/dellwp/vault_wp.yml: dellwp_wp_wordfence_key,
# put there by scripts/wp_provider_key.sh wordfence), reduced to an index, and every site checked against it; a NEW hit goes to ntfy once. An index older than wp_vulnfeed_max_age_days days is "NOT RUN", never
# "none known". The update parses about 120 MB of JSON, so its unit has a memory limit.
wp_clamav_dir: /var/lib/wp-clamav
wp_clamav_mem_mb: 2048
wp_clamscan_timeout_s: 1800
wp_clamav_update_calendar: "*-*-* 02:40:00"
wp_vulnfeed_dir: /etc/wp-vulnfeed
wp_vulnfeed_state_dir: /var/lib/wp-vulnfeed
wp_vulnfeed_url: https://www.wordfence.com/api/intelligence/v3/vulnerabilities/production
wp_vulnfeed_max_age_days: 3
wp_vulnfeed_cmd_timeout_s: 120
wp_vulnfeed_mem_mb: 2048
wp_vulnfeed_timeout_s: 1800
wp_vulnfeed_calendar: "*-*-* 04:20:00"

# Must-use plugins of the hosting service (templates/wp/mu/, tasks/wp_mu_common.yml): one root-owned directory on the VM, mounted read-only into every site's php container at /var/www/wp-mu and named
# by WPMU_PLUGIN_DIR in wp-config.php, so a friend's own wp-content/mu-plugins (held back by the import until you approve it) is a separate, inert folder and an import can never remove ours.
#   login throttle: failed logins per visitor address and per user name in a window; xmlrpc, application passwords and user listings are off unless the site's allow_* flag says otherwise
#   two-factor: the Two Factor plugin (pinned in vars/wp.yml), required of the roles in wp_2fa_roles
#   mail: mail_mode log (default; nothing leaves the site) or send (the provider's HTTPS API); the sender is <site>@wp_mail_sender_domain, the key is dellwp_wp_resend_key in host_vars/dellwp/vault_wp.yml
wp_mu_dir: "{{ wp_data_mount }}/mu"
# Where the php container sees it. Named in three places that must agree: the compose mount, WPMU_PLUGIN_DIR in wp-config.php and open_basedir in php.ini (without it PHP may not read the
# directory, is_dir() says no, and WordPress loads NO must-use plugin and says nothing: seen on dellwp 2026-10-25).
wp_mu_mount: /var/www/wp-mu
# The zips WP-CLI downloads from wordpress.org (a plugin or theme by slug and version, which never changes once published) are kept here between runs, so a second import of the same plugins
# downloads nothing, and a bad minute on the link to wordpress.org costs only the first time (dellwp 2026-10-25: one import took 937 s, almost all of it stalled downloads). Only the --code
# mode of wp-site-cli mounts it (root-only, 0700); every install is still checked against wordpress.org's checksums afterwards. Files older than wp_cli_cache_days days are removed by systemd-tmpfiles.
wp_cli_cache_dir: /var/cache/wp-cli
wp_cli_cache_days: 30
wp_2fa_roles: "administrator,shop_manager"
wp_login_limit_ip: 20
wp_login_limit_user: 10
wp_login_window_s: 900
wp_mail_sender_domain: "mail.{{ wp_domain }}"
wp_mail_per_hour: 20
wp_mail_per_day: 60
