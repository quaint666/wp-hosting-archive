---
# dellwp/wp_approvals_dellwp.yml
# Approvals by phone for the WordPress imports on dellwp: the signing key, the two ntfy logins and the listener service (tasks/wp_approvals_common.yml). Run dellwp/wp_sites_dellwp.yml first (it
# installs wp-site-import and the modules), and aopenvms/ntfy_aopenvms.yml once after scripts/wp_approvals_secrets.sh (it creates the ntfy users `approver` and `wpvm`).
# Secrets: dellwp_wp_master_secret (host_vars/dellwp/vault_wp.yml) and aopenpanel_ntfy_approver_password / aopenpanel_ntfy_wpvm_password (host_vars/aopenpanel/vault_private_services.yml).

- name: Deploy the approval listener on dellwp
  hosts: dellwp
  become: true

  vars:
    wp_master_secret: "{{ dellwp_wp_master_secret }}"
    # templates/ and scripts/ at the repo root: the paths are explicit, as in dellwp/wp_sites_dellwp.yml
    shared_template_dir: "{{ playbook_dir }}/../templates"
    wp_template_dir: "{{ shared_template_dir }}/wp"
    wp_scripts_dir: "{{ playbook_dir }}/../scripts"

  tasks:
    - name: Apply the approvals tasks (tasks/wp_approvals_common.yml)
      ansible.builtin.import_tasks: ../tasks/wp_approvals_common.yml

  handlers:
    - name: Restart the approval listener
      ansible.builtin.systemd:
        name: wp-approval-listener
        state: restarted
        daemon_reload: true
