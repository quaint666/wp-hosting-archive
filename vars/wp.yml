---
# The images of the WordPress sites on dellwp, and the uids they run as. Outside group_vars/ and host_vars/ on purpose: renovate.json ignores those paths, and the
# image manager reads the anchor comment directly above each line. The php-fpm tag is `<WordPress>-php<minor>-fpm`: the WordPress part only seeds a NEW site's
# core (the entrypoint never upgrades an existing one), the PHP minor is the real pin. PHP moves one minor at a time after the operator's canary, never by a
# merged PR alone. The task files have no default on purpose: a play that forgets to load this file fails on the undefined variable.
# renovate: depName=wordpress
wp_image_php: "wordpress:7.1.3-php8.5-fpm"
# renovate: depName=mariadb
wp_image_db: "mariadb:12.3.3"
# ClamAV runs in one-shot containers too (templates/wp/wp_clamscan.sh.j2 scans, wp_clamav_update.sh.j2 refreshes the signatures): the image carries the engine and freshclam, the signatures live on the VM
# (wp_clamav_dir) so a scan needs no network.
# renovate: depName=clamav/clamav
wp_image_clamav: "clamav/clamav:1.5.4"
# WP-CLI runs in a one-shot container of the official image with the same PHP minor as the sites (wordpress:cli-<version>-php<minor>). Renovate cannot read that tag
# shape, so the tag is built from two lines it can: this version (custom manager in renovate.json, like vars/docker.yml) and the php minor of wp_image_php above.
# The cli image is Alpine-based and the site image Debian-based: same PHP, different libc. The tools (templates/wp/wp_site_cli.sh.j2) bypass its entrypoint.
# renovate: datasource=github-releases depName=wp-cli/wp-cli
wp_cli_version: "2.12.0"
wp_image_cli: "wordpress:cli-{{ wp_cli_version }}-{{ wp_image_php | regex_search('php[0-9]+[.][0-9]+') }}"
# The uids the containers run as. php is www-data (33 in the image and on the VM, on purpose: the VM's nginx reads the uploads the container writes). The database
# must NOT be a uid with an account on the VM: the image's mysql is 999, which on dellwp is the alloy user (seen 2026-10-24: the data files showed as alloy:systemd-journal),
# so Alloy could read every site's database. mariadbd runs as any uid; this one has no account. The code is owned by root, uploads by the php uid, db/ by the db uid.
wp_php_uid: 33
wp_db_uid: 20999

# The official Two Factor plugin, loaded as a must-use plugin from wp_mu_dir (templates/wp/mu/20-wp-hosting-two-factor.php.j2, tasks/wp_mu_common.yml). Pinned by version AND checksum of the zip
# from downloads.wordpress.org: a download that differs is refused. Renovate does not follow wordpress.org plugins: to update, change both lines together (fetch the zip, read its source, run
# sha256sum on it) and rerun tests/php/run_all.php. The checksum below is of two-factor.0.17.0.zip fetched on 2026-10-25.
wp_two_factor_version: "0.17.0"
wp_two_factor_sha256: "4d1b0f8e5d82e24876c2b4e86f119122e28a8dbaf76dfde495173226c3356f37"
