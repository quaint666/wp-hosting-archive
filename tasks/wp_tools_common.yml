---
# tasks/wp_tools_common.yml
# The operator's tools on dellwp: wp-site-cli (WP-CLI in a throwaway container), wp-site-ext (plugins and themes, wordpress.org only), wp-site-install, wp-site-login-check and wp-site-import, with the library they share. No hosts:/become: and no
# handlers; imported via import_tasks into dellwp/wp_sites_dellwp.yml, which sets wp_template_dir and wp_scripts_dir. The scripts are rendered from templates/wp/ so the image pin, the site list,
# the paths and the limits come from the variables and exist in one place. Root-only (0750 root:root): no sudoers entry, no setuid. The site names are the allowlist, so
# adding a site means running this play again before the tools accept it. tests/test_wp_tools.py runs the rendered scripts against stand-ins for docker and curl.
# Check mode cannot show: the image pull, or whether a tool works once installed.
#
# HOW THE FILES GET THERE. Every task on the VM costs a round trip (1.3 s with pipelining), and this file used to make one per tool, unit and module (44 s of a 66 s run). The tasks named "Stage ..."
# now render into a temporary directory ON THE CONTROLLER (delegate_to localhost, become false, check_mode false: rendering is harmless and must happen in check mode too), and four
# synchronize tasks send the staged files with rsync: the tools, the library with the Python modules, the site templates, and the units. The owner and the modes are rsync options (--chown, --chmod), and each
# sync names its files with --files-from, so rsync never touches the destination directory itself (/usr/local/sbin is root:staff and is not ours). Nothing is deleted on the VM.

- name: Pull the WP-CLI image
  community.docker.docker_image_pull:
    name: "{{ wp_image_cli }}"
    pull: not_present

- name: Make the tools library directory
  ansible.builtin.file:
    path: "{{ wp_tools_lib }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The WP-CLI download cache (templates/wp/wp_site_cli.sh.j2): root only, and emptied of files older than wp_cli_cache_days days by systemd-tmpfiles, so it cannot grow for ever.
- name: Make the WP-CLI download cache directory
  ansible.builtin.file:
    path: "{{ wp_cli_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Age out the WP-CLI download cache
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/wp-cli-cache.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      d {{ wp_cli_cache_dir }} 0700 root root {{ wp_cli_cache_days }}d

- name: Make the staging directory on the controller
  ansible.builtin.tempfile:
    state: directory
    prefix: wp-stage-
  register: wp_stage
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

- name: Make the staging subdirectories
  ansible.builtin.file:
    path: "{{ wp_stage.path }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [bin, lib, units, lists, tpl, tpl/wp]
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

- name: Stage the tools library
  ansible.builtin.template:
    src: "{{ wp_template_dir }}/wp_tools_common.sh.j2"
    dest: "{{ wp_stage.path }}/lib/common.sh"
    mode: "0600"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

# wp-site-import is Python: the logic, the archive reader and the approval tokens are the tested modules in scripts/ (tests/test_wp_import.py, test_wp_wpress.py, test_wp_approvals.py), copied as they are; the wrapper below only
# carries the repo's values. wp_scripts_dir is set by the wrapper play.
- name: Stage the Python modules of wp-site-import
  ansible.builtin.copy:
    src: "{{ wp_scripts_dir }}/{{ item }}"
    dest: "{{ wp_stage.path }}/lib/{{ item }}"
    mode: "0600"
  loop:
    - wp_wpress.py
    - wp_approvals.py
    - wp_site_import.py
    - wp_vulnfeed.py
    - wp_ctl.py
    - wp_site_model.py
    - wp_site_renderer.py
    - wp_site_provision.py
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

- name: Stage the tools
  ansible.builtin.template:
    src: "{{ wp_template_dir }}/{{ item.src }}"
    dest: "{{ wp_stage.path }}/bin/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: wp_site_cli.sh.j2, dest: wp-site-cli }
    - { src: wp_site_install.sh.j2, dest: wp-site-install }
    - { src: wp_site_password.sh.j2, dest: wp-site-password }
    - { src: wp_site_ext.sh.j2, dest: wp-site-ext }
    - { src: wp_site_login_check.sh.j2, dest: wp-site-login-check }
    - { src: wp_site_cron.sh.j2, dest: wp-site-cron }
    - { src: wp_site_backup.sh.j2, dest: wp-site-backup }
    - { src: wp_site_restore.sh.j2, dest: wp-site-restore }
    - { src: wp_site_recover.sh.j2, dest: wp-site-recover }
    - { src: wp_site_delete.sh.j2, dest: wp-site-delete }
    - { src: wp_archive_purge.sh.j2, dest: wp-archive-purge }
    - { src: wp_site_update.sh.j2, dest: wp-site-update }
    - { src: wp_site_import.py.j2, dest: wp-site-import }
    - { src: wp_backup_check.sh.j2, dest: wp-backup-check }
    - { src: wp_restore_drill.sh.j2, dest: wp-restore-drill }
    - { src: wp_site_2fa_reset.sh.j2, dest: wp-site-2fa-reset }
    - { src: wp_clamscan.sh.j2, dest: wp-clamscan }
    - { src: wp_clamav_update.sh.j2, dest: wp-clamav-update }
    - { src: wp_vulnfeed.py.j2, dest: wp-vulnfeed }
    - { src: wp_ctl.py.j2, dest: wp-ctl }
    - { src: wp_site_provision.py.j2, dest: wp-site-provision }
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

# wp-site-provision renders a site's files on the VM, from these templates, with its own Jinja: they are staged with `copy`, not `template`, so they arrive as they are in the repo (the same files the sites
# play renders with Ansible; tests/test_wp_site_renderer.py proves both give the same text). The names are listed in scripts/wp_site_renderer.py TEMPLATES.
- name: Stage the site templates the provisioning tool renders
  ansible.builtin.copy:
    src: "{{ shared_template_dir }}/{{ item }}"
    dest: "{{ wp_stage.path }}/tpl/{{ item }}"
    mode: "0600"
  loop:
    - wp/site_env.j2
    - wp/site_wp-config.php.j2
    - wp/site_php.ini.j2
    - wp/site_fpm_pool.conf.j2
    - wp/site_compose.yml.j2
    - wp/site_nginx.conf.j2
    - compose_stack.service.j2
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

# The units the WordPress timers share. Per site only the timer is switched on or off (scripts/wp_site_provision.py, by the site's state). The notify unit needs
# ntfy-notify (tasks/ntfy_notify_common.yml, dellvms/ntfy_notify_dellvms.yml); a missing command fails the notify unit, which shows in `systemctl --failed`.
- name: Stage the WordPress job units
  ansible.builtin.template:
    src: "{{ wp_template_dir }}/{{ item.src }}"
    dest: "{{ wp_stage.path }}/units/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: wp_cron.service.j2, dest: "wp-cron@.service" }
    - { src: wp_cron.timer.j2, dest: "wp-cron@.timer" }
    - { src: wp_job_failed.service.j2, dest: "wp-job-failed@.service" }
    - { src: wp_backup.service.j2, dest: "wp-backup@.service" }
    - { src: wp_backup.timer.j2, dest: "wp-backup@.timer" }
    - { src: wp_update.service.j2, dest: "wp-update@.service" }
    - { src: wp_update.timer.j2, dest: "wp-update@.timer" }
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

# One check for all sites, not an instance per site: is every site still being backed up? (templates/wp/wp_backup_check.sh.j2)
- name: Stage the backup freshness check service
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-backup-check.service"
    mode: "0600"
    content: |
      [Unit]
      Description=Check that every WordPress site has a recent backup
      OnFailure=wp-job-failed@%N.service

      [Service]
      Type=oneshot
      ExecStart={{ wp_tools_bin }}/wp-backup-check

- name: Stage the backup freshness check timer
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-backup-check.timer"
    mode: "0600"
    content: |
      [Unit]
      Description=Check the WordPress backups are recent

      [Timer]
      OnCalendar={{ wp_backup_check_calendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target

# The monthly restore drill: one random site with a good backup, restored into scratch and booted, the result sent to ntfy (templates/wp/wp_restore_drill.sh.j2).
- name: Stage the monthly restore drill service
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-restore-drill.service"
    mode: "0600"
    content: |
      [Unit]
      Description=Monthly WordPress restore drill (one random site, restored into scratch)
      After=docker.service
      OnFailure=wp-job-failed@%N.service

      [Service]
      Type=oneshot
      ExecStart={{ wp_tools_bin }}/wp-restore-drill
      TimeoutStartSec={{ wp_drill_timeout_s }}
      Nice=10
      IOSchedulingClass=idle

- name: Stage the monthly restore drill timer
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-restore-drill.timer"
    mode: "0600"
    content: |
      [Unit]
      Description=Monthly WordPress restore drill

      [Timer]
      OnCalendar={{ wp_drill_calendar }}
      RandomizedDelaySec={{ wp_backup_jitter_s }}
      Persistent=true

      [Install]
      WantedBy=timers.target

# The archive purge: once a day, the archives of deleted sites whose time is up are removed (templates/wp/wp_archive_purge.sh.j2).
- name: Stage the archive purge service
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-archive-purge.service"
    mode: "0600"
    content: |
      [Unit]
      Description=Remove the archives of deleted WordPress sites whose time is up
      OnFailure=wp-job-failed@%N.service

      [Service]
      Type=oneshot
      ExecStart={{ wp_tools_bin }}/wp-archive-purge
      Nice=10
      IOSchedulingClass=idle

- name: Stage the archive purge timer
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/units/wp-archive-purge.timer"
    mode: "0600"
    content: |
      [Unit]
      Description=Daily purge of expired WordPress site archives

      [Timer]
      OnCalendar={{ wp_archive_purge_calendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target

# What is staged is what is sent: the lists name the staged files (rsync --files-from), so a file that is not staged is never touched on the VM and the destination directories are left alone.
- name: Find the staged files
  ansible.builtin.find:
    paths: "{{ wp_stage.path }}/{{ item }}"
    file_type: file
    recurse: true
  loop: [bin, lib, units, tpl]
  register: wp_staged
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

- name: Write the lists of the staged files
  ansible.builtin.copy:
    dest: "{{ wp_stage.path }}/lists/{{ item.item }}.list"
    content: "{{ item.files | map(attribute='path') | map('relpath', wp_stage.path ~ '/' ~ item.item) | sort | join('\n') }}\n"
    mode: "0600"
  loop: "{{ wp_staged.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

# --checksum: compare content, not times (the staged copies are new every run). --chown and --chmod make the owner and the mode part of what is compared, so a file whose mode drifted is sent
# again and the run says changed. Check mode is an rsync dry run: it lists what would be sent.
- name: Send the tools library and the Python modules
  ansible.posix.synchronize:
    src: "{{ wp_stage.path }}/lib/"
    dest: "{{ wp_tools_lib }}/"
    archive: false
    checksum: true
    perms: true
    owner: true
    group: true
    use_ssh_args: true
    rsync_opts:
      - "--files-from={{ wp_stage.path }}/lists/lib.list"
      - "--chown=root:root"
      - "--chmod=F0644"

- name: Send the site templates
  ansible.posix.synchronize:
    src: "{{ wp_stage.path }}/tpl/"
    dest: "{{ wp_tools_lib }}/templates/"
    archive: false
    checksum: true
    perms: true
    owner: true
    group: true
    use_ssh_args: true
    rsync_opts:
      - "--files-from={{ wp_stage.path }}/lists/tpl.list"
      - "--chown=root:root"
      - "--chmod=D0755,F0644"

- name: Send the tools
  ansible.posix.synchronize:
    src: "{{ wp_stage.path }}/bin/"
    dest: "{{ wp_tools_bin }}/"
    archive: false
    checksum: true
    perms: true
    owner: true
    group: true
    use_ssh_args: true
    rsync_opts:
      - "--files-from={{ wp_stage.path }}/lists/bin.list"
      - "--chown=root:root"
      - "--chmod=F0750"

- name: Send the WordPress units
  ansible.posix.synchronize:
    src: "{{ wp_stage.path }}/units/"
    dest: /etc/systemd/system/
    archive: false
    checksum: true
    perms: true
    owner: true
    group: true
    use_ssh_args: true
    rsync_opts:
      - "--files-from={{ wp_stage.path }}/lists/units.list"
      - "--chown=root:root"
      - "--chmod=F0644"
  notify: Reload systemd

# The site tasks enable timers next, and systemd must know the units first.
- name: Reload systemd now if a unit changed
  ansible.builtin.meta: flush_handlers

- name: Remove the staging directory
  ansible.builtin.file:
    path: "{{ wp_stage.path }}"
    state: absent
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  diff: false

- name: Enable the backup freshness check timer
  ansible.builtin.systemd:
    daemon_reload: true
    name: wp-backup-check.timer
    enabled: true
    state: started

- name: Enable the monthly restore drill timer
  ansible.builtin.systemd:
    daemon_reload: true
    name: wp-restore-drill.timer
    enabled: true
    state: started

- name: Enable the archive purge timer
  ansible.builtin.systemd:
    daemon_reload: true
    name: wp-archive-purge.timer
    enabled: true
    state: started

# The master secret and the provider key on the VM, for wp-site-provision (templates/wp/wp_site_provision.py.j2): the sites' database passwords and salts derive from the master secret, so the tool that makes a
# site on the VM needs it there. Root only, 0400, in a directory only root enters; the tool refuses a file anyone else can read. The values never appear in a log (no_log) or a diff. The provider key exists only
# while the vault has one: when it is removed from the vault the file goes, so the VM does not keep a key the repo no longer holds. Check mode shows that the files would change, not what is in them.
- name: Make the directory of the provisioning secrets
  ansible.builtin.file:
    path: "{{ wp_provision_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the master secret for wp-site-provision
  ansible.builtin.copy:
    dest: "{{ wp_provision_secret_dir }}/master_secret"
    content: "{{ wp_master_secret }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false

- name: Write the mail provider key for wp-site-provision
  ansible.builtin.copy:
    dest: "{{ wp_provision_secret_dir }}/resend_key"
    content: "{{ dellwp_wp_resend_key }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  diff: false
  when: dellwp_wp_resend_key is defined

- name: Take the mail provider key away when the vault has none
  ansible.builtin.file:
    path: "{{ wp_provision_secret_dir }}/resend_key"
    state: absent
  when: dellwp_wp_resend_key is not defined
