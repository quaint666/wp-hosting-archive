---
# tasks/wp_nginx_base_common.yml
# The nginx base for the WordPress sites on dellwp. No hosts:/become: and no handlers here: imported via import_tasks into the thin wrapper
# (dellwp/nginx_base_dellwp.yml), which defines the "Restart nginx" handler.
# The base RESTARTS nginx: a reload that nginx refuses (a zone redefined with another key) leaves the old config running while every tool says ok; a restart that
# fails is a failed unit and a red play. A site's vhost keeps the graceful reload. Vars (set by the wrapper):
#   wp_nginx_listen_port   the loopback port every vhost and the catch-all listen on (cloudflared dials this; terraform/cloudflare wp_origin must match)
#   wp_nginx_probe_port    a second loopback port on the same vhosts that ignores the maintenance flag ($wp_probe), for the update job's health probe; nothing outside dials it
#   wp_health_host         a host name only a local curl can send; its vhost answers 200 so the tunnel check can tell "nginx is up" from the catch-all's closed
#                          connection (both are in host_vars/dellwp/vars.yml)
#
# What the one file does:
# - The catch-all (default_server) closes the connection for any host name no site claims. The wildcard DNS record sends every name under the domain
#   to this VM, so without it the first vhost would answer typos and scanners. Site vhosts must not declare default_server.
# - The only client that ever connects is cloudflared on this VM (every listener is 127.0.0.1), so it is the one proxy trusted to say who the visitor is:
#   CF-Connecting-IP. Without this nginx would see the connector's address for everyone, and a rate limit would lock out every visitor at once.
# - The login rate limit zone (10 requests a minute per visitor address, shared by all sites), keyed so only /wp-login.php counts. A site's vhost applies it with
#   `limit_req zone=wp_login_attempts burst=5 nodelay;` at server level. The zone is named for its key: nginx keeps a zone alive across a reload, and a reload that
#   redefines the same name with another key is refused ([emerg], the old config keeps running, `nginx -t` still passes, `systemctl reload` still says ok; seen on
#   dellwp 2026-10-24). Change a zone's key or size and you change its name.
# - $wp_https ("on" when the tunnel forwarded an https request), for the sites' `fastcgi_param HTTPS`.
# - The page cache zone and the maps that say when a request must skip it ($wp_skip_cache). A vhost whose site is not stopped uses it (templates/wp/site_nginx.conf.j2); deploy this
#   base BEFORE the vhosts, or `nginx -t` fails on the unknown zone and the sites play keeps the old vhost.
# - Upload cap 64 MB. (server_tokens is already set in the distribution's nginx.conf: a second directive fails nginx -t, seen on dellwp 2026-10-23.)
#
# The write is validated like tasks/bloomy_nginx_loopback_common.yml: if nginx -t fails the previous file is restored and the play fails before nginx is
# reloaded (a first-ever file that fails is removed again). Check mode cannot show this on a VM without nginx yet: the package does not exist there.

- name: Deploy and validate the nginx base for the WordPress sites
  block:
    # nginx makes the cache directory itself (and gives it to its worker user) but only one level deep: with no /var/cache/nginx, `nginx -t` fails on mkdir (seen on dellwp 2026-10-30).
    - name: Make the parent of the page cache directory
      ansible.builtin.file:
        path: "{{ wp_page_cache_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the nginx base (settings and catch-all)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/wp_base.conf
        mode: "0644"
        backup: true
        content: |
          # Managed by Ansible (tasks/wp_nginx_base_common.yml).
          client_max_body_size 64m;

          set_real_ip_from 127.0.0.1;
          real_ip_header CF-Connecting-IP;

          # Keyed on the visitor address for /wp-login.php only: an empty key is not counted, so a site's server-level `limit_req zone=wp_login_attempts burst=5 nodelay;`
          # throttles logins and nothing else.
          map $request_uri $wp_login_key {
              default "";
              ~^/wp-login\.php $binary_remote_addr;
          }
          limit_req_zone $wp_login_key zone=wp_login_attempts:10m rate=10r/m;
          limit_req_status 429;

          # The tunnel terminates TLS; php must be told the request was HTTPS or WordPress loops on redirects. Safe to trust: only cloudflared on this VM connects.
          map $http_x_forwarded_proto $wp_https {
              default off;
              https on;
          }

          # 1 on the probe port: the vhosts skip their maintenance 503 for it. Only a process on this VM can connect there.
          map $server_port $wp_probe {
              default 0;
              {{ wp_nginx_probe_port }} 1;
          }

          # The page cache for anonymous visitors (host_vars/dellwp/vars.yml wp_page_cache_*; a vhost opts in with fastcgi_cache). Keyed on the host, so one site never sees another's pages.
          fastcgi_cache_path {{ wp_page_cache_path }} levels=1:2 keys_zone={{ wp_page_cache_zone }}:{{ wp_page_cache_keys_mb }}m max_size={{ wp_page_cache_max_mb }}m inactive=60m use_temp_path=off;

          # What must never be served from, or stored in, the cache. 1 = skip. A login, comment, post-password or cart cookie; WordPress's own endpoints, the REST API, search, previews,
          # WooCommerce's ajax and API calls; any request that names a .php file (only WordPress's pretty URLs are cached); an Authorization header; and the probe port, so the update job's
          # health check sees the site as it is now, not a page cached before the update.
          map $http_cookie $wp_cache_cookie {
              default 0;
              "~*(wordpress_logged_in_|wordpress_sec_|wp-postpass_|comment_author_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_)" 1;
          }
          map $request_uri $wp_cache_uri {
              default 0;
              "~*^/(wp-admin|wp-login\.php|wp-json|wp-cron\.php|xmlrpc\.php|wp-comments-post\.php|wp-mu|wp-content/plugins)" 1;
              "~*^/(cart|basket|checkout|my-account|wc-api)(/|$|\?)" 1;
              "~*\.php" 1;
              "~*[?&](preview|s|add-to-cart|wc-ajax|wc-api|doing_wp_cron|customize_changeset_uuid)=" 1;
          }
          map "$wp_cache_cookie$wp_cache_uri$http_authorization$wp_probe" $wp_skip_cache {
              default 1;
              "000" 0;
          }

          server {
              listen 127.0.0.1:{{ wp_nginx_listen_port }} default_server;
              listen 127.0.0.1:{{ wp_nginx_probe_port }} default_server;
              server_name _;
              return 444;
          }

          server {
              listen 127.0.0.1:{{ wp_nginx_listen_port }};
              server_name {{ wp_health_host }};
              access_log off;
              default_type text/plain;
              return 200 "ok\n";
          }
      register: wp_nginx_base
      notify: Restart nginx

    - name: Validate the nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      check_mode: false
  rescue:
    - name: Restore the previous nginx base
      ansible.builtin.copy:
        src: "{{ wp_nginx_base.backup_file }}"
        dest: /etc/nginx/conf.d/wp_base.conf
        mode: "0644"
        remote_src: true
      when: (wp_nginx_base | default({})).backup_file is defined

    # A first-ever deploy has no previous file to restore: take the new one out again, or the broken file would make every later reload fail.
    - name: Remove a first-ever nginx base that failed validation
      ansible.builtin.file:
        path: /etc/nginx/conf.d/wp_base.conf
        state: absent
      when:
        - (wp_nginx_base | default({})).changed | default(false)
        - (wp_nginx_base | default({})).backup_file is not defined

    - name: Fail after restoring the previous nginx base
      ansible.builtin.fail:
        msg: The new nginx base failed validation; the previous one was restored and nginx was not reloaded.
