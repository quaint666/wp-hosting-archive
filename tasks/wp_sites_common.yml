---
# tasks/wp_sites_common.yml
# The WordPress site engine on dellwp. No hosts:/become: and no handlers here: imported via import_tasks into the thin wrapper (dellwp/wp_sites_dellwp.yml), which
# loads vars/wp.yml and sets wp_master_secret. Vars: wp_sites and wp_site_defaults (host_vars/dellwp/vars.yml), wp_master_secret, the image pins (vars/wp.yml).
# Run order on a fresh VM: dellwp/wp_data_disk_dellwp.yml, dellwp/nginx_base_dellwp.yml, then this.
#
# This file only checks the list and loops; one site is tasks/wp_site_one_common.yml. The checks fail the play before anything changes: names, ports and project ids
# unique, the RAM limits and the disk quotas within what the VM and the data disk have (declared in host_vars/delloptiplex3040/vars.yml), reserved names refused.
# The same expressions are evaluated by tests/test_wp_sites_render.py, in CI and by hand, including the cases they must refuse.
# Removing an entry from wp_sites stops nothing and deletes nothing: a site that has to go is stopped and removed by hand (data is never deleted by this play).
# Check mode cannot show: the seed, the containers, the quota calls, whether the images pull, or whether nginx accepts the vhost.

# The vhosts use the zone and the maps the base defines; without them nginx -t fails and the vhost is rolled back (it did, 2026-10-24). Say so before changing anything.
- name: Read the nginx base on the VM
  ansible.builtin.slurp:
    src: /etc/nginx/conf.d/wp_base.conf
  register: wp_base_conf
  check_mode: false

- name: Stop if the nginx base is missing or out of date
  ansible.builtin.assert:
    that:
      - "'zone=wp_login_attempts:' in (wp_base_conf.content | b64decode)"
      - "'$wp_https' in (wp_base_conf.content | b64decode)"
    fail_msg: >-
      Run dellwp/nginx_base_dellwp.yml first: /etc/nginx/conf.d/wp_base.conf lacks the login zone or $wp_https that the site vhosts use. Nothing was changed.
    quiet: true

- name: Read this VM's declared size from the Proxmox host's list
  ansible.builtin.set_fact:
    wp_vm: "{{ hostvars['delloptiplex3040'].proxmox_vms | selectattr('name', 'eq', inventory_hostname) | first }}"

- name: Merge each site with the defaults
  ansible.builtin.set_fact:
    wp_sites_merged: "{{ (wp_sites_merged | default([])) + [wp_site_defaults | combine(item)] }}"
  loop: "{{ wp_sites }}"
  loop_control:
    label: "{{ item.name | default('(no name)') }}"

- name: Stop early if the site list does not fit this VM
  ansible.builtin.assert:
    that:
      - wp_sites | length > 0
      - wp_sites | selectattr('name', 'defined') | selectattr('port', 'defined') | selectattr('quota_id', 'defined') | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='name') | select('match', '^[a-z][a-z0-9-]{1,23}$') | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='name') | intersect(wp_reserved_names) | length == 0
      - wp_sites_merged | map(attribute='name') | unique | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='port') | unique | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='quota_id') | unique | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='port') | map('int') | select('gt', 1024) | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='quota_id') | map('int') | select('ge', 1000) | list | length == wp_sites | length
      - wp_sites_merged | map(attribute='state') | difference(['hold', 'live', 'stopped', 'closed']) | length == 0
      - wp_sites_merged | map(attribute='update_policy') | difference(['auto', 'notify', 'freeze']) | length == 0
      - (wp_sites_merged | rejectattr('state', 'in', ['stopped', 'closed']) | map(attribute='php_mem_mb') | map('int') | sum) + (wp_sites_merged | rejectattr('state', 'in', ['stopped', 'closed']) | map(attribute='db_mem_mb') | map('int') | sum) <= (wp_vm.memory | int) - (wp_vm_ram_reserve_mb | int)
      - (wp_sites_merged | rejectattr('state', 'eq', 'closed') | map(attribute='quota_mb') | map('int') | sum) + (wp_sites_merged | rejectattr('state', 'eq', 'closed') | map(attribute='backup_quota_mb') | map('int') | sum) <= (wp_vm.data_disk | int) * 1024 - (wp_data_reserve_mb | int)
      - (wp_backup_quota_offset | int) > (wp_sites_merged | map(attribute='quota_id') | map('int') | max) - (wp_sites_merged | map(attribute='quota_id') | map('int') | min)
      - (wp_sites_merged | map(attribute='quota_id') | map('int') | max) + (wp_backup_quota_offset | int) < (wp_scratch_quota_id | int)
      - (wp_archive_quota_id | int) != (wp_scratch_quota_id | int)
      - (wp_sites_merged | map(attribute='quota_id') | map('int') | max) + (wp_backup_quota_offset | int) < (wp_archive_quota_id | int)
    fail_msg: >-
      wp_sites (host_vars/dellwp/vars.yml) does not fit: every entry needs name, port and quota_id; names are 2 to 24 characters of a-z, 0-9 and -, not reserved, unique;
      ports above 1024 and project ids from 1000 are unique; state is hold, live, stopped or closed (a closed site is a tombstone: its name, port and project id stay reserved, but it holds no RAM and no disk); the memory limits of the sites that run plus {{ wp_vm_ram_reserve_mb }} MB must fit in the VM's
      {{ wp_vm.memory }} MB; the quotas and backup quotas of the sites that exist plus {{ wp_data_reserve_mb }} MB must fit in its {{ wp_vm.data_disk }} GB data disk; wp_backup_quota_offset must be
      larger than the spread of the quota ids (a backup project id must never equal another site's id) and the highest backup id must stay below wp_scratch_quota_id and wp_archive_quota_id, which must differ. Nothing was changed.
    quiet: true

# A closed site is a tombstone: it is in the list so that its name, port and project id are never given to another site, but nothing of it may be on the VM. The PLAY NEVER DELETES
# DATA: a site whose state was edited to closed by hand, with its directory still there, stops the play here, before anything is deployed. The data goes only through wp-site-delete
# (python3 scripts/wp_sites.py delete <site>), which makes the archive first and asks for the name to be typed.
# The archive directory is made by the data disk play (dellwp/wp_data_disk_dellwp.yml). Without it the quota task below fails with a bare lsattr error, even in check mode.
- name: Look for the archive directory
  ansible.builtin.stat:
    path: "{{ wp_archive_dir }}"
  register: wp_archive_stat
  check_mode: false

- name: Stop if the archive directory is missing
  ansible.builtin.assert:
    that:
      - wp_archive_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ wp_archive_dir }} does not exist. Run dellwp/wp_data_disk_dellwp.yml first: it makes the top-level directories of the data disk, including the archive of deleted sites. Nothing was changed.
    quiet: true

# The archive of deleted sites sits in a project of its own (the files made below the directory inherit it), so it can never grow past its quota.
- name: Put the archive of deleted sites in its quota project (tasks/wp_project_quota_common.yml)
  ansible.builtin.include_tasks: wp_project_quota_common.yml
  vars:
    wp_pq_path: "{{ wp_archive_dir }}"
    wp_pq_id: "{{ wp_archive_quota_id }}"
    wp_pq_mb: "{{ wp_archive_quota_mb }}"

- name: Look for the site directories of the closed sites
  ansible.builtin.stat:
    path: "{{ wp_data_mount }}/sites/{{ item.name }}"
  loop: "{{ wp_sites_merged | selectattr('state', 'eq', 'closed') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: wp_closed_dirs
  check_mode: false

- name: Look for the backup directories of the closed sites
  ansible.builtin.stat:
    path: "{{ wp_backup_dir }}/{{ item.name }}"
  loop: "{{ wp_sites_merged | selectattr('state', 'eq', 'closed') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: wp_closed_backups
  check_mode: false

- name: Stop if a closed site still has its data on the VM
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.invocation.module_args.path }} still exists, but the repo says that site is closed. The play never deletes data. Run python3 scripts/wp_sites.py delete <site>
      (it archives the site first and removes it), or set the state back if the edit was a mistake. Nothing was changed.
    quiet: true
  loop: "{{ wp_closed_dirs.results + wp_closed_backups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Deploy each site that exists (tasks/wp_site_one_common.yml)
  ansible.builtin.include_tasks: wp_site_one_common.yml
  loop: "{{ wp_sites_merged | rejectattr('state', 'eq', 'closed') | list }}"
  loop_control:
    loop_var: wp_s
    label: "{{ wp_s.name }} ({{ wp_s.state }})"

- name: Remove what a closed site left behind (tasks/wp_site_closed_common.yml)
  ansible.builtin.include_tasks: wp_site_closed_common.yml
  loop: "{{ wp_sites_merged | selectattr('state', 'eq', 'closed') | list }}"
  loop_control:
    loop_var: wp_s
    label: "{{ wp_s.name }} (closed)"

- name: Watch the data disk and every site's quota (tasks/wp_disk_check_common.yml)
  ansible.builtin.include_tasks: wp_disk_check_common.yml

- name: Install the status tool (tasks/wp_status_common.yml)
  ansible.builtin.include_tasks: wp_status_common.yml
