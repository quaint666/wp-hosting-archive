{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}" class="login" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
  <label>Authenticator code <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required maxlength="6"></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
