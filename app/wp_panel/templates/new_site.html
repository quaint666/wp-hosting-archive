{% extends "base.html" %}
{% block title %}New site{% endblock %}
{% block body %}
<p class="crumbs"><a href="{{ url_for('sites') }}">All sites</a></p>
<div class="page-head"><div><h1>New site</h1></div></div>
<section class="card">
<p class="notice">This makes an empty site on hold: the name is its host name and cannot be changed later, and WordPress is not installed yet. Nothing is public until you move it to live.</p>
<form method="post" action="{{ url_for('create_site') }}" class="login">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="req" value="{{ req }}">
  <label>Name <span class="small">letters, digits and single hyphens inside, 2 to 24 characters, starting with a letter</span>
    <input name="name" required minlength="2" maxlength="24" pattern="[a-z](?:[a-z0-9]|-(?!-)){0,22}[a-z0-9]" autocomplete="off" autocapitalize="none" spellcheck="false">
  </label>
  <label>Label <span class="small">optional, up to 100 characters</span>
    <input name="label" maxlength="100" autocomplete="off">
  </label>
  <div class="actions"><button type="submit">Create the site</button></div>
</form>
</section>
{% endblock %}
