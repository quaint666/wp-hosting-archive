<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}WordPress hosting{% endblock %} · dellwp</title>
<link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
{% block head %}{% endblock %}
</head>
<body>
{% if logged_in() %}
{% set ep = request.endpoint or '' %}
<header class="bar">
  <strong class="brand">dellwp</strong>
  <nav>
    <a href="{{ url_for('sites') }}"{% if ep in ('sites', 'site', 'new_site', 'password_form', 'install_form') %} aria-current="page"{% endif %}>Sites</a>
    <a href="{{ url_for('import_hub') }}"{% if ep.startswith('import') %} aria-current="page"{% endif %}>Import</a>
    <a href="{{ url_for('jobs') }}"{% if ep in ('jobs', 'job') %} aria-current="page"{% endif %}>Jobs</a>
    <a href="{{ url_for('audit') }}"{% if ep == 'audit' %} aria-current="page"{% endif %}>Audit</a>
  </nav>
  <form method="post" action="{{ url_for('logout') }}" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button type="submit">Log out</button>
  </form>
</header>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
